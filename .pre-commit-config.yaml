repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.7
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format

# Type checking is run via `pixi run -e dev typecheck` (which calls
# `ty check .`); ty does not yet ship a pre-commit hook, so it is not
# wired into pre-commit. Re-add a hook here once astral-sh publishes
# one.
