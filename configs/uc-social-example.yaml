dataset:
  name: uc-social
  paths:
    raw: null
    structured: data/uc-social
    processed: null

pipeline:
  cache_dir: pipeline_cache/uc-social
  steps:
    - name: StructureNormalizer
      params:
        directionality: canonical
        remove_duplicates: True
        reindex_nodes: True
        
    - name: TimestampNormalizer

    - name: TemporalSplitter
      params:
        train_ratio: 0.7
        val_ratio: 0.1
