# snapshot_size: 1000
# train_ratio: 0.70
# val_ratio: 0.15
# anomaly_ratio: 0.05

dataset:
  name: mooc
  paths:
    raw: null
    structured: data/mooc
    processed: null

pipeline:
  cache_dir: pipeline_cache/mooc
  steps:
    - name: DataLoader
      params:
        dataset_dir: /mnt/disk2/nazim/dgadb/data/mooc
    - name: StructureNormalizer
      params:
        directionality: canonical
        reindex_nodes: True
        remove_self_loops: False
        remove_duplicates: False
        
    - name: TimestampNormalizer

    - name: TemporalSplitter
      params:
        train_ratio: 0.7
        val_ratio: 0.1

