# snapshot_size: 1000
# train_ratio: 0.70
# anomaly_ratio: 0.05

dataset:
  name: digg-homo
  paths:
    raw: null
    structured: data/digg-homo
    processed: null

pipeline:
  cache_dir: pipeline_cache/digg-homo
  steps:
    - name: DataLoader
      params:
        dataset_dir: data/digg-homo
    - name: StructureNormalizer
      params:
        directionality: canonical
        reindex_nodes: True
        remove_self_loops: False
        remove_duplicates: False
        
    - name: TimestampNormalizer

    - name: TemporalSplitter
      params:
        train_ratio: 0.7
        val_ratio: 0.1

