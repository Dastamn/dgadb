model: Node2Vec

anomalies:
  anom_train_ratio: 0.0
  anom_val_ratio: 0.1
  anom_test_ratio: 0.1

hyperparameters:
  epochs: 200

  snapshot_size:
    default:
      type: random_search
      search_space: [2000, 6000, 10000, 20000, 30000, 40000, 50000, 60000]
    uc-social:
      fixed: 2000
    bitcoin-alpha:
      fixed: 1000
    bitcoin-otc:
      fixed: 1000
    email-dnc:
      fixed: 2000
    as-topology:
      fixed: 6000
    reddit:
      type: random_search
      search_space: [40000, 45000, 50000, 55000, 60000]
    mooc:
      type: random_search
      search_space: [20000, 25000, 30000, 35000, 40000]
    wiki:
      type: random_search
      search_space: [4000, 6000, 8000, 10000, 12000]
