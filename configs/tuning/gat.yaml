# GAT Hyperparameter Search Space Configuration

hidden_channels:
  type: choice
  values: [32, 64, 128, 256]

num_layers:
  type: choice
  values: [1, 2, 3]

num_heads:
  type: choice
  values: [1, 2, 4, 8]

dropout:
  type: uniform
  min: 0.1
  max: 0.7

learning_rate:
  type: loguniform
  min: 1e-4
  max: 1e-1

num_epoch:
  type: choice
  values: [50, 100, 200]

v2:
  type: choice
  values: [true, false]
