# GCN Hyperparameter Search Space Configuration

embedding_dim:
  type: choice
  values: [64, 128, 256, 512]

hidden_dim:
  type: choice  
  values: [64, 128, 256, 512]

num_layers:
  type: choice
  values: [1, 2, 3, 4]

dropout:
  type: uniform
  min: 0.1
  max: 0.7

learning_rate:
  type: loguniform
  min: 1e-4
  max: 1e-1

num_epoch:
  type: choice
  values: [50, 100, 200, 300]

decoder_epochs:
  type: choice
  values: [50, 100, 200]

decoder_learning_rate:
  type: loguniform
  min: 1e-4
  max: 1e-1

remove_self_loops:
  type: choice
  values: [true, false]
