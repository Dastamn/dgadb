[project]
name = "dgadb"
version = "0.1.0"
requires-python = ">= 3.11"
authors = [
  { name = "glachaud", email = "guillaume.lachaud@polytechnique.edu" },
  { name = "Nazim Mezhoudi" },
]
dependencies = ["ray[all]>=2.51.1,<3", "torch-geometric>=2.7.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgadb"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
dgadb = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
ipython = ">=9.7.0,<10"
python = "3.12.*"
tqdm = ">=4.67.1,<5"
scikit-learn = ">=1.7.2,<2"
polars = ">=1.35.1,<2"
matplotlib = ">=3.10.7,<4"
uv = ">=0.9.9,<0.10"
torch-scatter = ">=2.1.1,<3"
pytorch = ">=2.7.1,<3"
typer = ">=0.20.0,<0.21"
transformers = ">=4.57.1,<5"
gensim = ">=4.3.2,<5"

[tool.pixi.feature.dev.dependencies]
ty = "*"
ruff = ">=0.14.5,<0.15"
loguru = ">=0.7.3,<0.8"

[tool.pixi.environments]
dev = ["dev"]
