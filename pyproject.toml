[project]
name = "dgadb"
version = "0.1.0"
requires-python = ">= 3.11"
authors = [
  { name = "glachaud", email = "guillaume.lachaud@polytechnique.edu" },
  { name = "Nazim Mezhoudi" },
]
dependencies = ["ray[all]>=2.51.1", "torch-geometric>=2.7.0", "gensim>=4.4.0"]

[project.scripts]
dgadb = "dgadb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgadb"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
dgadb = { path = ".", editable = true }

[tool.pixi.tasks]
experiment = "python -m dgadb.experiment.runner"
tune = "python -m dgadb.experiment.tune"
aim = "aim up"
download-data = "uv run scripts/bitcoin.py && uv run scripts/uc-social.py && uv run scripts/email-dnc.py && uv run scripts/digg-homo.py && uv run scripts/as-topology.py && uv run scripts/enron.py && uv run scripts/epinions.py && uv run scripts/mooc.py && uv run scripts/reddit.py && uv run scripts/wiki.py && uv run scripts/amazon.py"

[tool.pixi.feature.dev.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "pyrefly check ."
check = { depends-on = ["lint", "typecheck"] }
pytest = "python -m pytest"

[tool.pixi.dependencies]
aim = ">=3.17.0"
ipython = ">=9.7.0"
pytest = ">=8.0.0"
python = "3.12.*"
tqdm = ">=4.67.1"
scikit-learn = ">=1.7.2"
polars = ">=1.35.1"
matplotlib = ">=3.10.7"
uv = ">=0.9.9"
torch-scatter = ">=2.1.1"
pytorch = ">=2.7.1"
typer = ">=0.20.0"
transformers = ">=4.57.1"
pyg-lib = ">=0.4.0"

[tool.pixi.feature.dev.dependencies]
ty = "*"
ruff = ">=0.14.13"
loguru = ">=0.7.3"
marimo = ">=0.19.7,<0.20"
duckdb = ">=1.4.4,<2"
sqlglot = ">=28.6.0,<29"
graph-tool = ">=2.98,<3"
fastexcel = ">=0.19.0,<0.20"
seaborn = ">=0.13.2,<0.14"

[tool.pixi.feature.cuda]
platforms = ["linux-64"]

[tool.pixi.feature.cuda.dependencies]
cuda-version = "12.*"

[tool.pixi.feature.cuda.system-requirements]
cuda = "12"

[tool.pixi.environments]
dev = ["dev"]
cuda = ["cuda"]
